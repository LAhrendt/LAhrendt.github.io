<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Den Kosmiske Kalender</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background-color: #f0f2f5; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #1a2a6c; text-align: center; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #ddd; }
        .tab { padding: 10px 20px; cursor: pointer; border: none; background: none; font-weight: bold; color: #777; }
        .tab.active { color: #1a2a6c; border-bottom: 3px solid #1a2a6c; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; margin-bottom: 15px; }
        button[type="submit"] { background: linear-gradient(to right, #1a2a6c, #b21f1f); color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 18px; }
        #resultat { margin-top: 25px; padding: 20px; background: #f8f9fa; border-left: 6px solid #1a2a6c; display: none; text-align: center; }
        .date-output { font-size: 22px; color: #b21f1f; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Kosmisk Kalender</h1>

    <div class="tabs">
        <button type="button" class="tab active" onclick="skiftMode('fraBB', this)">År efter Big Bang</button>
        <button type="button" class="tab" onclick="skiftMode('forNu', this)">År før nu</button>
    </div>
    
    <form onsubmit="event.preventDefault(); beregn();">
        <label id="inputLabel" style="font-weight:bold; display:block; margin-bottom:8px;">Antal år efter Big Bang:</label>
        <input type="number" id="aarIndtast" placeholder="Indtast tal..." required>
        <button type="submit">Beregn tidspunkt</button>
    </form>

    <div id="resultat">
        <div id="forklaringTekst" style="color:#666; font-style:italic;"></div>
        <div id="datoOutput" class="date-output"></div>
    </div>
</div>

<script>
    let nuværendeMode = 'fraBB';
    const UNIVERSETS_ALDER = 13800000000;

    function skiftMode(mode, element) {
        nuværendeMode = mode;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        element.classList.add('active');
        document.getElementById('inputLabel').innerText = (mode === 'fraBB') ? "Antal år efter Big Bang:" : "Antal år før i dag:";
        document.getElementById('resultat').style.display = 'none';
        document.getElementById('aarIndtast').focus();
    }

    function beregn() {
        const indtastning = parseFloat(document.getElementById('aarIndtast').value);
        const sekunderOmAaret = 365 * 24 * 60 * 60;
        
        if (isNaN(indtastning) || indtastning < 0 || indtastning > UNIVERSETS_ALDER) {
            alert("Tallet skal være mellem 0 og 13,8 milliarder.");
            return;
        }

        let årEfterBB = (nuværendeMode === 'fraBB') ? indtastning : UNIVERSETS_ALDER - indtastning;
        let totalSekunder = (årEfterBB / UNIVERSETS_ALDER) * sekunderOmAaret;

        let resultatDato = new Date(2026, 0, 1, 0, 0, 0); 
        resultatDato.setSeconds(totalSekunder);

        const muligheder = { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit', second: '2-digit' };
        
        document.getElementById('resultat').style.display = 'block';
        document.getElementById('forklaringTekst').innerText = (nuværendeMode === 'fraBB') 
            ? `Når der er gået ${indtastning.toLocaleString()} år efter Big Bang, er datoen:`
            : `En begivenhed for ${indtastning.toLocaleString()} år siden svarer i kalenderen til:`;
        document.getElementById('datoOutput').innerText = resultatDato.toLocaleDateString('da-DK', muligheder);
    }
</script>

</body>
</html>
